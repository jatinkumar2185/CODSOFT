<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>password_generator.py — CodSoft</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="window">
  <div class="titlebar">
    <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
    <div class="tab"><span class="filename">password_generator.py</span></div>
    <div class="eyebrow">CODSOFT · TASK 3 · Flask backend</div>
  </div>
  <div class="content">
    <p class="comment"># choose a length and character set, then generate</p>
    <h1>Password Generator</h1>
    <p class="sub">Generated server-side in Python using the <code>secrets</code> module.</p>
    <p class="conn" id="connStatus">● connecting…</p>

    <div class="output">
      <span id="passwordOut">••••••••••••</span>
      <button class="copy-btn" onclick="copyPassword()" id="copyBtn">Copy</button>
    </div>
    <div class="strength">
      <div class="bar" id="bar1"></div><div class="bar" id="bar2"></div><div class="bar" id="bar3"></div>
    </div>
    <div class="strength-label" id="strengthLabel">Strength: —</div>

    <div class="field">
      <label>Length <span class="val" id="lengthVal">16</span></label>
      <input type="range" id="length" min="4" max="64" value="16" oninput="onLengthChange()">
    </div>

    <div class="toggles">
      <label class="toggle"><input type="checkbox" id="upper" checked> Uppercase (A-Z)</label>
      <label class="toggle"><input type="checkbox" id="lower" checked> Lowercase (a-z)</label>
      <label class="toggle"><input type="checkbox" id="digits" checked> Digits (0-9)</label>
      <label class="toggle"><input type="checkbox" id="symbols"> Symbols (!@#$)</label>
    </div>

    <button class="generate" onclick="generatePassword()">⟳ Generate password</button>
    <div class="error" id="error"></div>
  </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
